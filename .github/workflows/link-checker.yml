name: Weekly Link Checker

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204,206,301,302,307,308
            --exclude 'linkedin.com'
            --exclude 'twitter.com'
            --exclude 'x.com'
            --exclude 'facebook.com'
            --exclude 'instagram.com'
            --exclude 'localhost'
            --exclude '127.0.0.1'
            --max-concurrency 5
            --timeout 30
            'https://govcongiants.org'
            'https://govcongiants.org/guides'
            'https://govcongiants.org/guides/cage-code'
            'https://govcongiants.org/guides/sam-gov-registration'
            'https://govcongiants.org/guides/8a-certification'
            'https://govcongiants.org/guides/sba-certifications'
            'https://govcongiants.org/glossary'
            'https://govcongiants.org/government-contract-help'
            'https://govcongiants.org/proposal-writing-services'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Link Report
        uses: actions/upload-artifact@v4
        with:
          name: link-checker-report
          path: lychee/out.md
          retention-days: 30

      - name: Create Issue on Failure
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('lychee/out.md', 'utf8');
            } catch (e) {
              report = 'Unable to read report file.';
            }

            // Check for existing open issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-links',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔗 Broken Links Detected',
                body: `## Weekly Link Check Report\n\nThe automated link checker found broken links.\n\n<details>\n<summary>Full Report</summary>\n\n\`\`\`\n${report.slice(0, 60000)}\n\`\`\`\n\n</details>\n\n---\n*Generated automatically by Link Checker workflow*`,
                labels: ['broken-links', 'seo']
              });
            }
