name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  audit-selects:
    name: Unranged Select Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency by design: no `npm ci` here, so an install failure can
      # never silently skip this guard. Self-test runs FIRST as a negative
      # control — it proves the audit still fails on an unbounded select before
      # we trust a clean audit run.
      - name: Guard self-test (negative control)
        run: npm run audit:selects:self-test

      - name: Audit for unranged Supabase selects
        run: npm run audit:selects

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Required env vars for build
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run on main branch to conserve API calls
    if: github.ref == 'refs/heads/main'
    env:
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      SAM_ENTITY_API_KEY: ${{ secrets.SAM_ENTITY_API_KEY }}
      SAM_CONTRACT_AWARDS_API_KEY: ${{ secrets.SAM_CONTRACT_AWARDS_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        # Continue even if integration tests fail (API limits)
        continue-on-error: true
