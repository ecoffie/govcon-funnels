<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Intelligence Dashboard</title>
    <style>
      /* Fallback so something always shows before React loads or if JS fails */
      body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      #root { width: 100%; min-height: 100vh; }
      #fallback { padding: 2rem; text-align: center; max-width: 420px; }
      #fallback h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      #fallback p { color: #6b7280; font-size: 0.875rem; margin: 0.5rem 0; }
      #fallback a { color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="fallback">
        <h1>Meeting Intelligence Dashboard</h1>
        <p>Loading…</p>
        <p>If this doesn’t change, run the app with a local server:</p>
        <p><code>cd dashboard && npm run dev</code></p>
        <p>Then open <a href="http://localhost:5173">http://localhost:5173</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
