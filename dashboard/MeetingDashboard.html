<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Intelligence Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [data-loading] { display: none; }
    body.loaded [data-loading] { display: block; }
    body.loaded [data-welcome] { display: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div data-welcome class="max-w-xl mx-auto mt-16 bg-white rounded-xl shadow-lg p-8 text-center">
    <h1 class="text-2xl font-semibold text-gray-800 mb-2">Meeting Intelligence Dashboard</h1>
    <p class="text-gray-600 mb-6">Open this file in Chrome. No server needed.</p>
    <label class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700 font-medium">
      Choose transcripts.json
      <input type="file" id="fileInput" accept=".json" class="hidden">
    </label>
    <p class="text-sm text-gray-500 mt-4">Select <code class="bg-gray-100 px-1 rounded">transcripts.json</code> from your dashboard folder (e.g. <code class="bg-gray-100 px-1 rounded">dashboard/public/</code>).</p>
  </div>

  <div data-loading class="max-w-6xl mx-auto hidden">
    <header class="bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap items-center justify-between gap-2">
      <h1 class="text-xl font-semibold text-gray-800">Meeting Intelligence</h1>
      <div class="flex items-center gap-2 text-sm">
        <label>From <input type="date" id="dateStart" class="rounded border px-2 py-1"></label>
        <label>To <input type="date" id="dateEnd" class="rounded border px-2 py-1"></label>
      </div>
    </header>
    <p id="summary" class="text-sm text-gray-500 mb-4"></p>
    <section class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Meetings</h2>
      <ul id="meetingList" class="space-y-3 max-h-[70vh] overflow-y-auto"></ul>
    </section>
  </div>

  <script>
    (function() {
      const fileInput = document.getElementById('fileInput');
      const welcome = document.querySelector('[data-welcome]');
      const loading = document.querySelector('[data-loading]');
      const meetingList = document.getElementById('meetingList');
      const summary = document.getElementById('summary');
      const dateStart = document.getElementById('dateStart');
      const dateEnd = document.getElementById('dateEnd');

      let transcripts = [];

      function setDefaultDates() {
        const end = new Date();
        const start = new Date();
        start.setFullYear(start.getFullYear() - 1);
        dateStart.value = start.toISOString().slice(0, 10);
        dateEnd.value = end.toISOString().slice(0, 10);
      }

      function filterByDate() {
        const start = dateStart.value;
        const end = dateEnd.value;
        return transcripts.filter(function(t) {
          const d = t.date || '';
          if (start && d < start) return false;
          if (end && d > end) return false;
          return true;
        });
      }

      function render() {
        const list = filterByDate();
        summary.textContent = 'Showing ' + list.length + ' meeting(s). AI analysis (commitments, customer insights) requires the backend server.';
        meetingList.innerHTML = list.map(function(t) {
          const participants = (t.participants || []).join(', ');
          const turns = (t.sentences || []).length;
          return '<li class="border border-gray-200 rounded-lg p-4"><div class="font-medium">' + escapeHtml(t.title || t.id) + '</div><div class="text-gray-500 text-sm mt-1">' + (t.date || '') + ' · ' + escapeHtml(participants) + '</div><div class="text-xs text-gray-400 mt-1">' + turns + ' turns</div></li>';
        }).join('');
      }

      function escapeHtml(s) {
        if (!s) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = function() {
          try {
            const data = JSON.parse(r.result);
            transcripts = Array.isArray(data.transcripts) ? data.transcripts : [];
            document.body.classList.add('loaded');
            setDefaultDates();
            dateStart.addEventListener('change', render);
            dateEnd.addEventListener('change', render);
            render();
          } catch (err) {
            alert('Could not parse JSON: ' + err.message);
          }
        };
        r.readAsText(file);
      });

      setDefaultDates();
    })();
  </script>
</body>
</html>
